<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f6870">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Capstone Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a two-pane reading desk — scrollable feed on the left, the open paper on the right; collapses to list + slide-over sheet on phones. */
:root{
  --bg:#f2f5f5; --panel:#ffffff; --ink:#13232a; --muted:#5a6c72; --line:#d9e2e3;
  --accent:#0f6870; --accent-soft:#dcefef; --star:#a8650f; --star-soft:#f8ead4; --no:#8a959a;
  --t-neural:#7a4fc0; --t-imaging:#c0455a; --t-hci:#1d7fb8; --t-robotics:#3f8a3a; --t-audio:#b8792a; --t-impact:#0f6870;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --panel:#152024; --ink:#e3ecec; --muted:#93a6aa; --line:#25363b;
  --accent:#5fc6c4; --accent-soft:#183a3c; --star:#f0b452; --star-soft:#3a2c14; --no:#6e7f84;
  --t-neural:#b49af0; --t-imaging:#f08797; --t-hci:#6ab8e8; --t-robotics:#86c97f; --t-audio:#e6b06a; --t-impact:#5fc6c4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --panel:#152024; --ink:#e3ecec; --muted:#93a6aa; --line:#25363b;
  --accent:#5fc6c4; --accent-soft:#183a3c; --star:#f0b452; --star-soft:#3a2c14; --no:#6e7f84;
  --t-neural:#b49af0; --t-imaging:#f08797; --t-hci:#6ab8e8; --t-robotics:#86c97f; --t-audio:#e6b06a; --t-impact:#5fc6c4;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;letter-spacing:-.01em;margin:0;line-height:1.1}
h1 span{color:var(--accent)}
.status{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.status b{color:var(--ink);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:7px;font-weight:500;color:var(--muted);min-height:28px;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.tabs button:focus-visible,.chip:focus-visible,.item:focus-visible,.rate button:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-family:var(--f-mono);font-size:.75rem;opacity:.8}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.desk{flex:1;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;min-height:0}
.list{display:flex;flex-direction:column;gap:2px;min-width:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding:12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);border-color:var(--line)}
.item .dot{margin-top:7px}
.item h3{margin:0;font-size:.95rem;font-weight:600;line-height:1.3;text-wrap:balance}
.item .meta{grid-column:2;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.mark{font-size:.8rem;color:var(--muted);min-width:1.2em;text-align:right}
.mark.star{color:var(--star)}
.item.dim{opacity:.5}
.new{font-family:var(--f-mono);font-size:.65rem;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,32px) 28px;min-width:0;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow-y:auto}
.back{all:unset;display:none;cursor:pointer;color:var(--accent);font-weight:500;padding:6px 0;margin-bottom:6px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;text-transform:uppercase;letter-spacing:.04em}
.eyebrow .th{color:var(--c);font-weight:500}
.detail h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.15;margin:8px 0 12px;text-wrap:balance;letter-spacing:-.01em}
.detail p{margin:0;max-width:68ch}
.sec{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:.72rem;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fit{background:var(--accent-soft);border-radius:10px;padding:12px 14px;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.82rem;padding:3px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.tag.tech{font-size:.82rem}
dl.terms{margin:0;display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:8px 16px;max-width:68ch;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
dl.terms dt{font-weight:600}
dl.terms dd{margin:0;color:var(--muted)}
@media (max-width:520px){dl.terms{grid-template-columns:minmax(0,1fr);gap:2px}dl.terms dd{margin-bottom:8px}}
ul.future{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.src{font-size:.75rem;color:var(--muted);font-style:italic}
.feas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meter{display:inline-flex;gap:3px}
.meter i{width:22px;height:8px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}
.feas b{font-weight:600}
.needs{color:var(--muted);font-size:.9rem}
.rate{display:flex;flex-wrap:wrap;gap:8px}
.rate button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:500;min-height:24px;display:inline-flex;gap:8px;align-items:center}
.rate button[data-r="star"][aria-pressed="true"]{background:var(--star-soft);border-color:var(--star);color:var(--star)}
.rate button[data-r="maybe"][aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rate button[data-r="no"][aria-pressed="true"]{background:var(--bg);border-color:var(--no);color:var(--no)}
textarea{width:100%;box-sizing:border-box;min-height:84px;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.saved{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-height:1em}
a.open{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;align-self:flex-start}
.empty{padding:28px 18px;color:var(--muted);text-align:left;max-width:52ch}
.empty strong{color:var(--ink);display:block;font-family:var(--f-display);font-size:1.15rem;margin-bottom:6px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.idea h3{font-family:var(--f-display);margin:0;font-size:1.2rem;line-height:1.2}
.idea dl{margin:0;display:grid;gap:8px}
.idea dt{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.idea dd{margin:0;font-size:.92rem}
.hd-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ghost{all:unset;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.backup p{margin:0;max-width:70ch;color:var(--muted)}
.backup textarea{font-family:var(--f-mono);font-size:.75rem;min-height:110px}
.notice{font-size:.85rem;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
@media (max-width:820px){
  .desk{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;z-index:5;border-radius:0;border:none;max-height:none;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(100%);transition:transform .22s ease}
  .detail.open{transform:none}
  .back{display:inline-block}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Capstone <span>Radar</span></h1>
    <div class="hd-right"><div class="status" id="status"><span>Loading reading list…</span></div><button class="ghost" id="openBackup">Back up ratings</button></div>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="View">
      <button id="tab-feed" data-tab="feed" aria-pressed="true">Feed <span class="count" id="c-feed"></span></button>
      <button id="tab-starred" data-tab="starred" aria-pressed="false">Starred <span class="count" id="c-starred"></span></button>
      <button id="tab-ideas" data-tab="ideas" aria-pressed="false">Ideas <span class="count" id="c-ideas"></span></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by theme"></div>
  </div>

  <section class="backup" id="backup" hidden>
    <p>Your ratings and notes are stored on this device only. Copy them to move them to another device, or paste them into your Claude chat so the weekly update can learn what you like.</p>
    <textarea id="bkText" aria-label="Ratings backup text"></textarea>
    <div class="rate"><button id="bkCopy">Copy backup</button><button id="bkImport">Import pasted backup</button></div>
    <div class="saved" id="bkMsg"></div>
  </section>

  <div id="feedView" class="desk">
    <div class="list" id="list" role="list"></div>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>
  <div id="ideasView" hidden></div>
</div>

<script>
const THEMES = {
  neural:{label:"Neural & bio-signals",c:"--t-neural"},
  imaging:{label:"Medical imaging",c:"--t-imaging"},
  hci:{label:"Vision for interaction",c:"--t-hci"},
  robotics:{label:"Robot perception",c:"--t-robotics"},
  audio:{label:"Audio & speech for health",c:"--t-audio"},
  impact:{label:"Social impact",c:"--t-impact"}
};
const FEAS = {1:"Ambitious",2:"Stretch",3:"Very doable"};
const state = {items:[], ratings:{}, ideas:[], meta:null, tab:"feed", theme:"all", sel:null, writable:true, dbReady:false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const fmtDate = d => { if(!d) return ""; if(/^\d{4}-\d{2}$/.test(d)){ const m = new Date(d+"-15"); return m.toLocaleDateString(undefined,{month:"short",year:"numeric"}); } const t = new Date(d); return isNaN(t) ? esc(d) : t.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); };

try{ const t = localStorage.getItem("cr-theme"); if(t) state.theme = t; }catch(e){}

function renderChips(){
  const box = $("#chips");
  const counts = {};
  visibleBase().forEach(i => counts[i.theme] = (counts[i.theme]||0)+1);
  const keys = ["all", ...Object.keys(THEMES)];
  box.innerHTML = keys.map(k => {
    const t = THEMES[k];
    const n = k==="all" ? visibleBase().length : (counts[k]||0);
    return `<button class="chip" id="chip-${k}" data-theme="${k}" aria-pressed="${state.theme===k}" style="${t?`--c:var(${t.c})`:""}">${t?'<span class="dot"></span>':""}${t?esc(t.label):"All themes"} <span class="count">${n}</span></button>`;
  }).join("");
}

function visibleBase(){
  let xs = state.items.slice();
  if(state.tab==="starred") xs = xs.filter(i => state.ratings[i.id]?.rating==="star");
  return xs;
}
function visible(){
  let xs = visibleBase();
  if(state.theme!=="all") xs = xs.filter(i => i.theme===state.theme);
  const rank = i => state.ratings[i.id]?.rating==="no" ? 1 : 0;
  xs.sort((a,b) => rank(a)-rank(b) || String(b.added||"").localeCompare(String(a.added||"")) || String(b.date||"").localeCompare(String(a.date||"")));
  return xs;
}

function renderList(){
  const xs = visible();
  const list = $("#list");
  const latest = state.items.reduce((m,i)=> (i.added||"")>m ? i.added : m, "");
  if(!state.items.length){
    list.innerHTML = `<div class="empty"><strong>${state.dbReady?"No papers yet":"Opening your reading list"}</strong>${state.dbReady?"The first batch of papers and articles appears here. After that, a fresh batch arrives every Thursday morning.":"Loading papers…"}</div>`;
    $("#detail").innerHTML = ""; return;
  }
  if(!xs.length){
    list.innerHTML = `<div class="empty"><strong>Nothing here yet</strong>${state.tab==="starred"?"Mark papers with ★ Interesting and they collect here.":"No papers in this theme yet."}</div>`;
  } else {
    list.innerHTML = xs.map(i => {
      const r = state.ratings[i.id]?.rating;
      const t = THEMES[i.theme]||{};
      const mark = r==="star"?'<span class="mark star" title="Interesting">★</span>':r==="maybe"?'<span class="mark" title="Maybe">?</span>':r==="no"?'<span class="mark" title="Not for me">✕</span>':'<span class="mark"></span>';
      return `<div class="item${r==="no"?" dim":""}" role="listitem" tabindex="0" data-id="${esc(i.id)}" aria-current="${state.sel===i.id}" style="--c:var(${t.c||"--muted"})"><span class="dot"></span><h3>${esc(i.title)}${i.added===latest&&!r?'<span class="new">NEW</span>':""}</h3>${mark}<div class="meta">${esc(i.source)} · ${fmtDate(i.date)}</div></div>`;
    }).join("");
  }
  if(!state.sel || !state.items.find(i=>i.id===state.sel)) state.sel = xs[0]?.id || state.items[0]?.id;
  renderDetail();
}

function renderDetail(){
  const i = state.items.find(x => x.id===state.sel);
  const d = $("#detail");
  if(!i){ d.innerHTML = ""; return; }
  const t = THEMES[i.theme]||{label:i.theme,c:"--muted"};
  const r = state.ratings[i.id] || {};
  const lv = Number(i.feasibility)||0;
  d.innerHTML = `
    <button class="back" id="back">‹ Back to list</button>
    <div class="eyebrow" style="--c:var(${t.c})"><span class="th">${esc(t.label)}</span><span>${esc(i.kind||"Paper")}</span><span>${esc(i.source)}</span><span>${fmtDate(i.date)}</span></div>
    <h2>${esc(i.title)}</h2>
    ${i.authors?`<div class="needs">${esc(i.authors)}</div>`:""}
    <div class="sec"><h4>Summary</h4><p>${esc(i.summary)}</p></div>
    ${(i.terms||[]).length?`<div class="sec"><h4>Words to know</h4><dl class="terms">${i.terms.map(t=>`<dt>${esc(t.term)}</dt><dd>${esc(t.meaning)}</dd>`).join("")}</dl></div>`:""}
    <div class="sec"><h4>Why it fits you</h4><p class="fit">${esc(i.fit)}</p></div>
    <div class="sec"><h4>Topics</h4><div class="tags">${(i.topics||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
    <div class="sec"><h4>Methods used</h4><div class="tags">${(i.techniques||[]).map(x=>`<span class="tag tech">${esc(x)}</span>`).join("")}</div></div>
    <div class="sec"><h4>Future research</h4><ul class="future">${(i.future||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <span class="src">${i.futureFrom==="paper"?"As proposed by the authors.":"The authors don't list next steps in the abstract; these are open directions inferred from the work."}</span></div>
    <div class="sec"><h4>Undergrad feasibility</h4><div class="feas"><span class="meter" aria-label="${lv} of 3">${[1,2,3].map(n=>`<i class="${n<=lv?"on":""}"></i>`).join("")}</span><b>${FEAS[lv]||""}</b></div><div class="needs">${esc(i.needs)}</div></div>
    <div class="sec"><h4>Your take</h4>
      <div class="rate" role="group" aria-label="Rate this paper">
        <button id="r-star" data-r="star" aria-pressed="${r.rating==="star"}">★ Interesting</button>
        <button id="r-maybe" data-r="maybe" aria-pressed="${r.rating==="maybe"}">? Maybe</button>
        <button id="r-no" data-r="no" aria-pressed="${r.rating==="no"}">✕ Not for me</button>
      </div>
      <textarea id="note" placeholder="Notes: what caught your eye, questions to ask a professor…">${esc(r.note||"")}</textarea>
      <div class="saved" id="saved"></div>
      ${state.writable?"":'<div class="notice">Ratings and notes can’t be saved in this view.</div>'}
    </div>
    <div class="sec"><a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">Read the source ↗</a></div>`;
  d.scrollTop = 0;
}

function renderIdeas(){
  const v = $("#ideasView");
  if(!state.ideas.length){
    v.innerHTML = `<div class="empty"><strong>No project sketches yet</strong>Star the papers that excite you. When a few of them cluster around one problem, the Thursday update turns that cluster into a project sketch here: the problem, what makes it new, the data or hardware you need, and a semester-sized scope.</div>`;
    return;
  }
  v.innerHTML = `<div class="ideas">${state.ideas.map(x=>`
    <section class="idea"><h3>${esc(x.title)}</h3><dl>
      <div><dt>Problem</dt><dd>${esc(x.problem)}</dd></div>
      <div><dt>What would be new</dt><dd>${esc(x.novelty)}</dd></div>
      <div><dt>Semester scope</dt><dd>${esc(x.scope)}</dd></div>
      <div><dt>You'd need</dt><dd>${esc(x.needs)}</dd></div>
      ${x.related?`<div><dt>Builds on</dt><dd>${esc((x.related||[]).join(", "))}</dd></div>`:""}
    </dl></section>`).join("")}</div>`;
}

function renderStatus(){
  const m = state.meta;
  const n = state.items.length;
  const starred = Object.values(state.ratings).filter(r=>r.rating==="star").length;
  $("#c-feed").textContent = n||"";
  $("#c-starred").textContent = starred||"";
  $("#c-ideas").textContent = state.ideas.length||"";
  $("#status").innerHTML = `<span>Updated <b>${m?.lastUpdate?fmtDate(m.lastUpdate):"—"}</b></span><span>Next batch <b>${m?.nextUpdate?fmtDate(m.nextUpdate):"Thursday"}</b></span><span><b>${n}</b> papers</span>`;
}

function render(){
  renderStatus();
  const ideas = state.tab==="ideas";
  $("#feedView").hidden = ideas; $("#ideasView").hidden = !ideas;
  $("#chips").hidden = ideas;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab===state.tab));
  if(ideas) renderIdeas(); else { renderChips(); renderList(); }
}

// Interaction
document.addEventListener("click", e => {
  const tab = e.target.closest(".tabs button");
  if(tab){ state.tab = tab.dataset.tab; state.sel = null; render(); return; }
  const chip = e.target.closest(".chip");
  if(chip){ state.theme = chip.dataset.theme; try{localStorage.setItem("cr-theme",state.theme)}catch(_){} state.sel=null; render(); return; }
  const item = e.target.closest(".item");
  if(item){ openItem(item.dataset.id); return; }
  if(e.target.closest("#back")){ $("#detail").classList.remove("open"); return; }
  const rb = e.target.closest(".rate button");
  if(rb){ const cur = state.ratings[state.sel]?.rating; saveRating(state.sel, {rating: cur===rb.dataset.r ? null : rb.dataset.r}); }
});
document.addEventListener("keydown", e => {
  const item = e.target.closest?.(".item");
  if(item && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openItem(item.dataset.id); }
});
function openItem(id){
  state.sel = id;
  document.querySelectorAll(".item").forEach(el => el.setAttribute("aria-current", el.dataset.id===id));
  renderDetail();
  $("#detail").classList.add("open");
}
let noteTimer = null;
document.addEventListener("input", e => {
  if(e.target.id!=="note") return;
  const id = state.sel, val = e.target.value;
  $("#saved").textContent = "…";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>saveRating(id,{note:val}, true), 900);
});

const LS_KEY = "cr-ratings-v1";
function loadRatings(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state.ratings)); return true; }catch(e){ return false; } }
function saveRating(id, patch, quiet){
  if(!id) return;
  const next = {...(state.ratings[id]||{}), ...patch, updatedAt:new Date().toISOString()};
  if(next.rating===null) delete next.rating;
  state.ratings[id] = next;
  if(!quiet) render();
  const ok = persist();
  const s=$("#saved"); if(s && state.sel===id) s.textContent = ok ? "Saved on this device" : "Couldn’t save: storage is blocked (private browsing?)";
}

// Backup: ratings live only on this device, so make them easy to move.
function exportText(){
  return JSON.stringify({app:"capstone-radar", exported:new Date().toISOString(), ratings:state.ratings}, null, 1);
}
document.addEventListener("click", async e => {
  if(e.target.closest("#openBackup")){ $("#backup").hidden = !$("#backup").hidden; $("#bkText").value = exportText(); $("#bkMsg").textContent=""; return; }
  if(e.target.closest("#bkCopy")){
    const t = exportText(); $("#bkText").value = t;
    try{ await navigator.clipboard.writeText(t); $("#bkMsg").textContent = "Copied. Paste it into your Claude chat so the Thursday update can learn from it."; }
    catch(_){ $("#bkText").select(); $("#bkMsg").textContent = "Selected. Tap Copy in the menu."; }
    return;
  }
  if(e.target.closest("#bkImport")){
    try{
      const j = JSON.parse($("#bkText").value);
      const r = j.ratings || j;
      if(typeof r!=="object"||Array.isArray(r)) throw 0;
      state.ratings = {...state.ratings, ...r}; persist(); render();
      $("#bkMsg").textContent = "Imported " + Object.keys(r).length + " ratings.";
    }catch(_){ $("#bkMsg").textContent = "That text isn’t a ratings backup. Paste the full text you copied earlier."; }
  }
});

async function loadJSON(path, fallback){
  try{ const r = await fetch(path, {cache:"no-cache"}); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return fallback; }
}
state.ratings = loadRatings();
render();
(async () => {
  const [items, ideas, meta] = await Promise.all([loadJSON("data/items.json", []), loadJSON("data/ideas.json", []), loadJSON("data/meta.json", null)]);
  state.items = items; state.ideas = ideas.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))); state.meta = meta; state.dbReady = true;
  render();
})();
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
